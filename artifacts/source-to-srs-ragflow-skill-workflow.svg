<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2450" viewBox="0 0 1600 2450">
  <defs>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 22px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .label { font: 500 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .small { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 12px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
      .main { fill: #eff6ff; stroke: #2563eb; }
      .code { fill: #f0fdf4; stroke: #16a34a; }
      .semantic { fill: #fff7ed; stroke: #f97316; }
      .rag { fill: #f5f3ff; stroke: #7c3aed; }
      .decision { fill: #fef2f2; stroke: #dc2626; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .skill { fill: #fdf4ff; stroke: #c026d3; }
      .arrow { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .sectionLine { stroke: #cbd5e1; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="2450" fill="#f8fafc"/>

  <text x="800" y="60" text-anchor="middle" class="title">源码逆向生成 SRS 并构建 RAGFlow 知识库通用链路</text>
  <text x="800" y="96" text-anchor="middle" class="small">目标：从项目源码中提取需求语义，生成可检索 SRS，并沉淀为可推广 Skill</text>

  <!-- Section 1 -->
  <text x="80" y="150" class="subtitle">第一层：源码 → SRS → RAGFlow 知识库</text>
  <line x1="80" y1="166" x2="1520" y2="166" class="sectionLine"/>

  <!-- Top flow -->
  <rect x="640" y="200" width="280" height="70" class="box main"/>
  <text x="780" y="230" text-anchor="middle" class="label">输入项目源码</text>
  <text x="780" y="252" text-anchor="middle" class="small">后端 / 前端 / SQL / 配置</text>

  <rect x="640" y="320" width="280" height="70" class="box main"/>
  <text x="780" y="350" text-anchor="middle" class="label">确定逆向范围</text>
  <text x="780" y="372" text-anchor="middle" class="small">项目、模块、功能边界</text>

  <rect x="640" y="440" width="280" height="70" class="box main"/>
  <text x="780" y="470" text-anchor="middle" class="label">定位核心代码资产</text>
  <text x="780" y="492" text-anchor="middle" class="small">为需求抽取建立输入集合</text>

  <path d="M780 270 L780 320" class="arrow"/>
  <path d="M780 390 L780 440" class="arrow"/>

  <!-- Code assets grid -->
  <rect x="95" y="575" width="230" height="95" class="box code"/>
  <text x="210" y="606" text-anchor="middle" class="label">Controller / Router</text>
  <text x="210" y="630" text-anchor="middle" class="small">接口入口</text>
  <text x="210" y="650" text-anchor="middle" class="small">功能边界</text>

  <rect x="350" y="575" width="230" height="95" class="box code"/>
  <text x="465" y="606" text-anchor="middle" class="label">Service / UseCase</text>
  <text x="465" y="630" text-anchor="middle" class="small">业务规则</text>
  <text x="465" y="650" text-anchor="middle" class="small">异常分支</text>

  <rect x="605" y="575" width="230" height="95" class="box code"/>
  <text x="720" y="606" text-anchor="middle" class="label">DTO / VO / Schema</text>
  <text x="720" y="630" text-anchor="middle" class="small">字段、必填</text>
  <text x="720" y="650" text-anchor="middle" class="small">格式、长度</text>

  <rect x="860" y="575" width="230" height="95" class="box code"/>
  <text x="975" y="606" text-anchor="middle" class="label">Entity / Model</text>
  <text x="975" y="630" text-anchor="middle" class="small">数据结构</text>
  <text x="975" y="650" text-anchor="middle" class="small">关联关系</text>

  <rect x="1115" y="575" width="230" height="95" class="box code"/>
  <text x="1230" y="606" text-anchor="middle" class="label">SQL / Permission</text>
  <text x="1230" y="630" text-anchor="middle" class="small">菜单、权限</text>
  <text x="1230" y="650" text-anchor="middle" class="small">配置、字典</text>

  <rect x="1370" y="575" width="230" height="95" class="box code"/>
  <text x="1485" y="606" text-anchor="middle" class="label">Frontend Page</text>
  <text x="1485" y="630" text-anchor="middle" class="small">页面交互</text>
  <text x="1485" y="650" text-anchor="middle" class="small">用户操作</text>

  <path d="M780 510 C780 545 210 545 210 575" class="arrow"/>
  <path d="M780 510 C780 545 465 545 465 575" class="arrow"/>
  <path d="M780 510 C780 545 720 545 720 575" class="arrow"/>
  <path d="M780 510 C780 545 975 545 975 575" class="arrow"/>
  <path d="M780 510 C780 545 1230 545 1230 575" class="arrow"/>
  <path d="M780 510 C780 545 1485 545 1485 575" class="arrow"/>

  <rect x="640" y="735" width="280" height="70" class="box semantic"/>
  <text x="780" y="765" text-anchor="middle" class="label">源码事实抽取</text>
  <text x="780" y="787" text-anchor="middle" class="small">把实现信息转为需求事实</text>

  <path d="M210 670 C210 710 780 710 780 735" class="arrow"/>
  <path d="M465 670 C465 710 780 710 780 735" class="arrow"/>
  <path d="M720 670 C720 710 780 710 780 735" class="arrow"/>
  <path d="M975 670 C975 710 780 710 780 735" class="arrow"/>
  <path d="M1230 670 C1230 710 780 710 780 735" class="arrow"/>
  <path d="M1485 670 C1485 710 780 710 780 735" class="arrow"/>

  <rect x="640" y="855" width="280" height="70" class="box semantic"/>
  <text x="780" y="885" text-anchor="middle" class="label">需求语义归纳</text>
  <text x="780" y="907" text-anchor="middle" class="small">形成可写入 SRS 的结构化信息</text>

  <path d="M780 805 L780 855" class="arrow"/>

  <!-- Semantic outputs -->
  <rect x="135" y="980" width="180" height="60" class="box semantic"/>
  <text x="225" y="1015" text-anchor="middle" class="small">功能清单</text>

  <rect x="335" y="980" width="180" height="60" class="box semantic"/>
  <text x="425" y="1015" text-anchor="middle" class="small">主业务流程</text>

  <rect x="535" y="980" width="180" height="60" class="box semantic"/>
  <text x="625" y="1015" text-anchor="middle" class="small">字段规则</text>

  <rect x="735" y="980" width="180" height="60" class="box semantic"/>
  <text x="825" y="1015" text-anchor="middle" class="small">业务规则</text>

  <rect x="935" y="980" width="180" height="60" class="box semantic"/>
  <text x="1025" y="1015" text-anchor="middle" class="small">异常处理</text>

  <rect x="1135" y="980" width="180" height="60" class="box semantic"/>
  <text x="1225" y="1015" text-anchor="middle" class="small">权限规则</text>

  <rect x="1335" y="980" width="180" height="60" class="box semantic"/>
  <text x="1425" y="1005" text-anchor="middle" class="small">验收标准</text>
  <text x="1425" y="1025" text-anchor="middle" class="small">边界排除</text>

  <path d="M780 925 C780 955 225 955 225 980" class="arrow"/>
  <path d="M780 925 C780 955 425 955 425 980" class="arrow"/>
  <path d="M780 925 C780 955 625 955 625 980" class="arrow"/>
  <path d="M780 925 C780 955 825 955 825 980" class="arrow"/>
  <path d="M780 925 C780 955 1025 955 1025 980" class="arrow"/>
  <path d="M780 925 C780 955 1225 955 1225 980" class="arrow"/>
  <path d="M780 925 C780 955 1425 955 1425 980" class="arrow"/>

  <rect x="640" y="1100" width="280" height="70" class="box main"/>
  <text x="780" y="1130" text-anchor="middle" class="label">SRS 初稿生成</text>
  <text x="780" y="1152" text-anchor="middle" class="small">按模板组织需求文档</text>

  <path d="M225 1040 C225 1080 780 1080 780 1100" class="arrow"/>
  <path d="M425 1040 C425 1080 780 1080 780 1100" class="arrow"/>
  <path d="M625 1040 C625 1080 780 1080 780 1100" class="arrow"/>
  <path d="M825 1040 C825 1080 780 1080 780 1100" class="arrow"/>
  <path d="M1025 1040 C1025 1080 780 1080 780 1100" class="arrow"/>
  <path d="M1225 1040 C1225 1080 780 1080 780 1100" class="arrow"/>
  <path d="M1425 1040 C1425 1080 780 1080 780 1100" class="arrow"/>

  <rect x="640" y="1220" width="280" height="70" class="box main"/>
  <text x="780" y="1250" text-anchor="middle" class="label">按 SRS 模板重构</text>
  <text x="780" y="1272" text-anchor="middle" class="small">章节、字段、异常、验收</text>

  <path d="M780 1170 L780 1220" class="arrow"/>

  <rect x="640" y="1340" width="280" height="70" class="box rag"/>
  <text x="780" y="1370" text-anchor="middle" class="label">RAGFlow 友好化改写</text>
  <text x="780" y="1392" text-anchor="middle" class="small">连续段落优先，减少表格依赖</text>

  <path d="M780 1290 L780 1340" class="arrow"/>

  <rect x="180" y="1460" width="230" height="70" class="box rag"/>
  <text x="295" y="1490" text-anchor="middle" class="small">字段规则连续段落</text>
  <text x="295" y="1512" text-anchor="middle" class="tiny">避免表格抽取不稳定</text>

  <rect x="455" y="1460" width="230" height="70" class="box rag"/>
  <text x="570" y="1490" text-anchor="middle" class="small">异常处理连续段落</text>
  <text x="570" y="1512" text-anchor="middle" class="tiny">错误消息可直接检索</text>

  <rect x="730" y="1460" width="230" height="70" class="box rag"/>
  <text x="845" y="1490" text-anchor="middle" class="small">验收标准连续段落</text>
  <text x="845" y="1512" text-anchor="middle" class="tiny">用具体问法稳定命中</text>

  <rect x="1005" y="1460" width="230" height="70" class="box rag"/>
  <text x="1120" y="1490" text-anchor="middle" class="small">标题和正文相邻</text>
  <text x="1120" y="1512" text-anchor="middle" class="tiny">保留语义边界</text>

  <path d="M780 1410 C780 1440 295 1440 295 1460" class="arrow"/>
  <path d="M780 1410 C780 1440 570 1440 570 1460" class="arrow"/>
  <path d="M780 1410 C780 1440 845 1440 845 1460" class="arrow"/>
  <path d="M780 1410 C780 1440 1120 1440 1120 1460" class="arrow"/>

  <rect x="640" y="1585" width="280" height="70" class="box main"/>
  <text x="780" y="1615" text-anchor="middle" class="label">生成 PDF</text>
  <text x="780" y="1637" text-anchor="middle" class="small">ReportLab / DOCX / 其他工具</text>

  <path d="M295 1530 C295 1565 780 1565 780 1585" class="arrow"/>
  <path d="M570 1530 C570 1565 780 1565 780 1585" class="arrow"/>
  <path d="M845 1530 C845 1565 780 1565 780 1585" class="arrow"/>
  <path d="M1120 1530 C1120 1565 780 1565 780 1585" class="arrow"/>

  <rect x="640" y="1705" width="280" height="70" class="box main"/>
  <text x="780" y="1735" text-anchor="middle" class="label">本地文本层检查</text>
  <text x="780" y="1757" text-anchor="middle" class="small">标题、正文、关键规则可提取</text>

  <path d="M780 1655 L780 1705" class="arrow"/>

  <polygon points="780,1825 920,1895 780,1965 640,1895" class="decision" filter="url(#shadow)"/>
  <text x="780" y="1888" text-anchor="middle" class="label">文本层适合</text>
  <text x="780" y="1910" text-anchor="middle" class="label">检索吗？</text>

  <path d="M780 1775 L780 1825" class="arrow"/>
  <path d="M640 1895 C430 1895 430 1375 640 1375" class="arrow dashed"/>
  <text x="425" y="1878" class="small">否：回到友好化改写</text>

  <rect x="1085" y="1860" width="260" height="70" class="box rag"/>
  <text x="1215" y="1890" text-anchor="middle" class="label">上传 RAGFlow 知识库</text>
  <text x="1215" y="1912" text-anchor="middle" class="small">book + DeepDOC</text>
  <path d="M920 1895 L1085 1895" class="arrow"/>
  <text x="970" y="1878" class="small">是</text>

  <rect x="1085" y="1980" width="260" height="70" class="box rag"/>
  <text x="1215" y="2010" text-anchor="middle" class="label">chunk 质量检查</text>
  <text x="1215" y="2032" text-anchor="middle" class="small">数量、短块、语义边界</text>
  <path d="M1215 1930 L1215 1980" class="arrow"/>

  <!-- Section 2 -->
  <text x="80" y="2140" class="subtitle">第二层：知识库 → TestHub 自动化闭环（增强链路）</text>
  <line x1="80" y1="2156" x2="1520" y2="2156" class="sectionLine"/>

  <rect x="80" y="2200" width="300" height="70" class="box output"/>
  <text x="230" y="2230" text-anchor="middle" class="label">可用 SRS 知识库</text>
  <text x="230" y="2252" text-anchor="middle" class="small">业务需求、字段、异常、验收</text>

  <rect x="430" y="2200" width="300" height="70" class="box output"/>
  <text x="580" y="2230" text-anchor="middle" class="label">API 文档知识库</text>
  <text x="580" y="2252" text-anchor="middle" class="small">接口、字段、响应、鉴权</text>

  <rect x="780" y="2200" width="300" height="70" class="box output"/>
  <text x="930" y="2230" text-anchor="middle" class="label">执行约束知识库</text>
  <text x="930" y="2252" text-anchor="middle" class="small">token、变量提取、最小字段</text>

  <rect x="1130" y="2200" width="320" height="70" class="box skill"/>
  <text x="1290" y="2230" text-anchor="middle" class="label">RAGFlow Agent</text>
  <text x="1290" y="2252" text-anchor="middle" class="small">生成 TestHub 场景 JSON</text>

  <path d="M1215 2050 C1215 2120 230 2120 230 2200" class="arrow"/>
  <path d="M380 2235 L430 2235" class="arrow"/>
  <path d="M730 2235 L780 2235" class="arrow"/>
  <path d="M1080 2235 L1130 2235" class="arrow"/>

  <text x="80" y="2350" class="small">原则：SRS 生成与测试执行约束应分层沉淀，避免把业务需求文档和 TestHub 执行经验补丁混在同一个通用 skill 中。</text>
  <text x="80" y="2380" class="small">建议输出：SRS 生成 skill 只负责源码 → SRS → 知识库；执行约束作为独立增强层参与 TestHub 场景生成。</text>
</svg>
